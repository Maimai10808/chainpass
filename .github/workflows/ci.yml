name: CI

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: true
      TURBO_TELEMETRY_DISABLED: "1"
      NEXT_TELEMETRY_DISABLED: "1"

      # CI-only database URL. Unit tests require DATABASE_URL during module loading.
      # PostgreSQL itself is added later for integration/E2E tests.
      DATABASE_URL: postgresql://chainpass:chainpass@127.0.0.1:5432/chainpass

      # CI build-only values.
      # These are not production deployment settings.
      NEXT_PUBLIC_API_URL: http://localhost:3000/api
      NEXT_PUBLIC_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000

      NEXT_PUBLIC_CHAIN_ID: "11155111"
      NEXT_PUBLIC_CHAINPASS_CONTRACT_ADDRESS: "0xbA3e9bCbe448E928c5e71f4bE6415E7e0e3E5ABb"
      NEXT_PUBLIC_REOWN_PROJECT_ID: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.6.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter api exec prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  api-e2e:
    name: API E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: chainpass
          POSTGRES_PASSWORD: chainpass_ci
          POSTGRES_DB: chainpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chainpass -d chainpass"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: true
      NODE_ENV: test

      DATABASE_URL: postgresql://chainpass:chainpass_ci@127.0.0.1:5432/chainpass

      BETTER_AUTH_SECRET: chainpass-ci-better-auth-secret-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3001
      WEB_ORIGIN: http://localhost:3000

      QR_VERIFICATION_SECRET: chainpass-ci-qr-secret-at-least-32-characters

      CHAIN_ID: "11155111"
      CHAINPASS_CONTRACT_ADDRESS: "0xbA3e9bCbe448E928c5e71f4bE6415E7e0e3E5ABb"

      BLOCKCHAIN_INTEGRATION: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.6.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter api exec prisma generate

      - name: Apply database migrations
        run: pnpm --filter api exec prisma migrate deploy --config prisma7.config.ts

      - name: Run API E2E tests
        run: pnpm --filter api test:e2e
