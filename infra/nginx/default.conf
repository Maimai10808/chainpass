upstream chainpass_web {
    server web:3000;
    keepalive 16;
}

upstream chainpass_api {
    server api:3001;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 2m;
    # Application Mint waits for a receipt before returning.
    proxy_read_timeout 180s;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /api {
        return 308 /api/;
    }

    location = /api/auth {
        return 308 /api/auth/;
    }

    # Better Auth owns /api/auth/*, so preserve this prefix upstream.
    location /api/auth/ {
        proxy_pass http://chainpass_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Business routes are defined without an /api prefix in NestJS.
    location /api/ {
        proxy_pass http://chainpass_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://chainpass_web;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
