nodeLinker: hoisted

packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@parcel/watcher': true
  "@prisma/engines": false
  "@reown/appkit": false
  "@scarf/scarf": false
  '@shopify/react-native-skia': true
  '@swc/core': true
  '@tarojs/binding': true
  '@tarojs/cli': true
  bufferutil: false
  core-js: true
  core-js-pure: true
  esbuild: true
  keccak: false
  prisma: false
  unrs-resolver: false
  utf-8-validate: false
minimumReleaseAgeExclude:
  - expo-constants@57.0.20 || 57.0.21
  - expo-modules-core@57.0.20 || 57.0.21
  - expo@57.0.26 || 57.0.27
  - '@expo/ui@57.0.21 || 57.0.22'
  - expo-router@57.0.24 || 57.0.25
  - '@expo/cli@57.0.28'
  - '@expo/config-plugins@57.0.10'
  - '@expo/config@57.0.10'
  - '@expo/image-utils@0.11.6'
  - '@expo/metro-config@57.0.13'
  - '@expo/metro-file-map@57.0.4'
  - '@expo/prebuild-config@57.0.17'
  - '@expo/require-utils@57.0.6'
  - '@expo/router-server@57.0.12'
  - babel-preset-expo@57.0.14
  - expo-asset@57.0.19
  - expo-modules-autolinking@57.0.14
  - expo-linking@57.0.12
overrides:
  "@wagmi/connectors": "6.2.0"
  "@wagmi/core": "2.22.1"
